<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 1 · Geolocalización y Redes Sociales</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg:     #030508;
            --surf:   #0c0f16;
            --surf2:  #131825;
            --surf3:  #1b2030;
            --bdr:    #1e2336;
            --bdr2:   #2a3050;
            --acc:    #6c63ff;
            --acc-d:  rgba(108,99,255,0.13);
            --cyn:    #00d4ff;
            --cyn-d:  rgba(0,212,255,0.13);
            --txt:    #e2e5f0;
            --txts:   #8b90a7;
            --txtd:   #636882;
            --grn:    #00c897;
            --ffd:    'Rajdhani', sans-serif;
            --ff:     'Sora', sans-serif;
            --r:      10px;
            --rl:     14px;
            --t:      0.18s;
            --ease:   cubic-bezier(0.4,0,0.2,1);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: var(--ff);
            background: var(--bg);
            color: var(--txt);
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--bdr2); border-radius: 3px; }

        /* ── HEADER ── */
        .app-header {
            background: var(--surf);
            border-bottom: 1px solid var(--bdr);
            padding: 0 24px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .app-logo {
            font-family: var(--ffd);
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--txt);
        }
        .app-logo span { color: var(--cyn); }
        .app-header-title {
            font-size: 11px;
            color: var(--txtd);
            letter-spacing: 0.5px;
        }
        .app-header-title b { color: var(--acc); font-weight: 600; }
        .practice-badge {
            background: var(--acc-d);
            color: var(--acc);
            border: 1px solid rgba(108,99,255,0.25);
            border-radius: 20px;
            padding: 3px 12px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* ── LAYOUT PRINCIPAL ── */
        .layout {
            display: grid;
            grid-template-columns: 300px 1fr 360px;
            gap: 14px;
            padding: 14px;
            flex: 1;
            overflow: hidden;
        }

        /* ── PANEL ── */
        .panel {
            background: var(--surf);
            border: 1px solid var(--bdr);
            border-radius: var(--rl);
            padding: 18px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .panel-zero { padding: 0; overflow: hidden; }

        /* ── FORM ELEMENTS ── */
        .field-label {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--txtd);
            margin-bottom: 7px;
            display: block;
        }

        select {
            width: 100%;
            padding: 10px 14px;
            background: var(--surf3);
            border: 1px solid var(--bdr);
            border-radius: var(--r);
            color: var(--txt);
            font-family: var(--ff);
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 16px;
            outline: none;
            cursor: pointer;
            transition: border-color var(--t), box-shadow var(--t);
            appearance: auto;
        }
        select:focus {
            border-color: var(--cyn);
            box-shadow: 0 0 0 3px var(--cyn-d);
        }
        select option { background: var(--surf2); color: var(--txt); }

        /* ── INFO BOXES ── */
        .info-box {
            background: var(--surf2);
            border: 1px solid var(--bdr);
            border-left: 3px solid var(--cyn);
            border-radius: var(--r);
            padding: 12px 14px;
            margin-bottom: 10px;
        }
        .info-box strong {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--txtd);
            display: block;
            margin-bottom: 4px;
        }
        .info-box p {
            font-size: 12px;
            color: var(--cyn);
            font-family: monospace;
            font-weight: 600;
            margin: 0;
            line-height: 1.4;
        }

        /* ── IFRAME ── */
        .panel-zero iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: var(--rl);
            display: block;
        }

        /* ── FB VIEWER ── */
        .fb-viewer {
            flex: 1;
            border: 1px solid var(--bdr2);
            border-radius: var(--r);
            overflow: hidden;
            margin-bottom: 12px;
            background: #fff;
            min-height: 0;
        }
        .fb-viewer iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ── BOTONES ── */
        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: var(--r);
            text-decoration: none;
            font-family: var(--ff);
            font-size: 12px;
            font-weight: 600;
            transition: all var(--t) var(--ease);
            margin-top: 8px;
            border: 1px solid transparent;
        }
        .btn-web {
            background: rgba(0,200,151,0.12);
            color: var(--grn);
            border-color: rgba(0,200,151,0.3);
        }
        .btn-web:hover {
            background: var(--grn);
            color: #fff;
            transform: translateY(-1px);
        }
        .btn-x {
            background: var(--surf2);
            color: var(--txts);
            border-color: var(--bdr2);
        }
        .btn-x:hover {
            background: var(--surf3);
            color: var(--txt);
            border-color: var(--bdr2);
            transform: translateY(-1px);
        }

        /* ── SOCIAL LABEL ── */
        .social-label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .social-label span {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--txtd);
        }
        .social-dot {
            width: 6px; height: 6px;
            background: var(--grn);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

        /* ── RESPONSIVE ── */
        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; grid-template-rows: auto 300px auto; overflow: auto; }
            .panel-zero { height: 300px; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="app-header">
        <div class="app-logo">TECH<span>HUB</span></div>
        <div class="app-header-title">Portal de Prácticas &nbsp;/&nbsp; <b>Geolocalización y Redes Sociales</b></div>
        <span class="practice-badge">PRÁCTICA 1</span>
    </header>

    <!-- LAYOUT -->
    <div class="layout">

        <!-- PANEL IZQUIERDO: Controles -->
        <div class="panel">
            <label class="field-label">Seleccionar institución</label>
            <select id="sel" onchange="actualizar()">
                <option value="utn">UTN Nezahualcóyotl</option>
                <option value="uaem">UAEM Nezahualcóyotl</option>
                <option value="lasalle">La Salle Neza</option>
                <option value="fes">FES Aragón (UNAM)</option>
            </select>

            <div class="info-box">
                <strong>Coordenadas GPS</strong>
                <p id="coords">--</p>
            </div>

            <div class="info-box">
                <strong>Dirección oficial</strong>
                <p id="dir">--</p>
            </div>

            <div style="margin-top: auto; padding-top: 12px;">
                <a id="linkWeb" href="#" target="_blank" class="btn-link btn-web">
                    <i class="fas fa-globe"></i> Visitar Página Oficial
                </a>
            </div>
        </div>

        <!-- PANEL CENTRAL: Mapa -->
        <div class="panel panel-zero">
            <iframe id="mapa" src="" title="Mapa de ubicación"></iframe>
        </div>

        <!-- PANEL DERECHO: Redes Sociales -->
        <div class="panel">
            <div class="social-label">
                <div class="social-dot"></div>
                <span>Comunidad social</span>
            </div>

            <div class="fb-viewer">
                <iframe id="fb"
                    allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"
                    title="Facebook page">
                </iframe>
            </div>

            <a id="linkX" href="#" target="_blank" class="btn-link btn-x">
                <i class="fab fa-x-twitter"></i> Ver perfil oficial en X
            </a>
        </div>

    </div>

    <script>
        const db = {
            "utn": {
                c: "19.3899, -98.9856",
                d: "Lázaro Cárdenas s/n, Benito Juárez, Nezahualcóyotl.",
                m: "https://maps.google.com/maps?q=19.3899,-98.9856&hl=es&z=16&output=embed",
                fb: "https://www.facebook.com/plugins/page.php?href=https%3A%2F%2Fwww.facebook.com%2FUTNOficial&tabs=timeline&width=340&height=450&small_header=true",
                x: "https://x.com/OficialUTN",
                web: "https://utn.edomex.gob.mx/"
            },
            "uaem": {
                c: "19.3980, -98.9890",
                d: "Av. de los Búhos s/n, Universidad, Nezahualcóyotl.",
                m: "https://maps.google.com/maps?q=19.3980,-98.9890&hl=es&z=16&output=embed",
                fb: "https://www.facebook.com/plugins/page.php?href=https%3A%2F%2Fwww.facebook.com%2FCU.UAEMNEZA.OFICIAL&tabs=timeline&width=340&height=450&small_header=true",
                x: "https://x.com/UAEM_MX",
                web: "https://www.uaemex.mx/"
            },
            "lasalle": {
                c: "19.3810, -98.9950",
                d: "Av. Adolfo López Mateos s/n, Nezahualcóyotl.",
                m: "https://maps.google.com/maps?q=19.3810,-98.9950&hl=es&z=16&output=embed",
                fb: "https://www.facebook.com/plugins/page.php?href=https%3A%2F%2Fwww.facebook.com%2Flasalleneza&tabs=timeline&width=340&height=450&small_header=true",
                x: "https://x.com/LaSalle_MX",
                web: "https://ulsaneza.edu.mx/"
            },
            "fes": {
                c: "19.4746, -99.0463",
                d: "Av. Rancho Seco s/n, Bosques de Aragón, Neza.",
                m: "https://maps.google.com/maps?q=19.4746,-99.0463&hl=es&z=16&output=embed",
                fb: "https://www.facebook.com/plugins/page.php?href=https%3A%2F%2Fwww.facebook.com%2FFESAragonUNAM&tabs=timeline&width=340&height=450&small_header=true",
                x: "https://x.com/ici_fesaragon",
                web: "https://www.aragon.unam.mx/"
            }
        };

        function actualizar() {
            const u = db[document.getElementById("sel").value];
            document.getElementById("coords").innerText = u.c;
            document.getElementById("dir").innerText    = u.d;
            document.getElementById("mapa").src         = u.m;
            document.getElementById("fb").src           = u.fb;
            document.getElementById("linkX").href       = u.x;
            document.getElementById("linkWeb").href     = u.web;
        }
        window.onload = actualizar;
    </script>
</body>
</html>
