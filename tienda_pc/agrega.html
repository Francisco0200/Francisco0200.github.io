<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Producto | PC Master</title>
    <script type="module" src="js/lib/manejaErrores.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-body: #121212; --bg-card: #1e1e1e; --primary: #007bff; --text: #fff; }
        body { font-family: 'Roboto', sans-serif; background: var(--bg-body); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .card-form {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid #333;
        }

        h1 { margin: 0 0 20px; color: var(--primary); text-align: center; text-transform: uppercase; letter-spacing: 1px; }

        label { display: block; margin-top: 15px; color: #aaa; font-size: 0.9em; }
        
        output, input { 
            display: block; width: 100%; padding: 12px; margin-top: 5px; 
            background: #2c2c2c; border: 1px solid #444; color: white; 
            border-radius: 6px; box-sizing: border-box; font-size: 1.1em;
        }
        
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 8px rgba(0, 123, 255, 0.3); }

        .actions { display: flex; gap: 10px; margin-top: 30px; }
        
        button { 
            flex: 2; background: var(--primary); color: white; border: none; 
            padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; 
            transition: 0.3s;
        }
        button:hover { background: #0056b3; transform: translateY(-2px); }

        a.cancel { 
            flex: 1; text-align: center; padding: 12px; color: #aaa; 
            text-decoration: none; border: 1px solid #444; border-radius: 6px; transition: 0.3s;
        }
        a.cancel:hover { background: #333; color: white; }
    </style>
</head>
<body>

 <form id="formulario" class="card-form">
  <h1>Añadir al Carrito</h1>
  
  <input type="hidden" name="id">

  <label>Producto</label>
  <output name="producto">Cargando...</output>

  <label>Precio Unitario</label>
  <output name="precio" style="color: #00d2ff; font-weight: bold;">...</output>

  <label>Cantidad *</label>
  <input name="cantidad" type="number" min="1" value="1" required>

  <div class="actions">
      <a href="index.html" class="cancel">Cancelar</a>
      <button type="submit">🛒 Agregar</button>
  </div>
 </form>

 <script type="module">
  import { descargaVista } from "./js/lib/descargaVista.js"
  import { submitAccion } from "./js/lib/submitAccion.js"

  const params = new URL(location.href).searchParams
  if (params.has("id")) {
    descargaVista("php/vista-agrega.php?id=" + params.get("id"))
    formulario.addEventListener("submit", (e) => submitAccion(e, "php/det-venta-agrega.php", formulario, "index.html"))
  } else {
    location.href = "index.html"
  }
 </script>
</body>
</html>
