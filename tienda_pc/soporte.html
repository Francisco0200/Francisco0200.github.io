<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Soporte Técnico | PC Master</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; background-color: #121212; color: #fff; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    
    /* CABECERA */
    header { background: #1e1e1e; padding: 15px 20px; border-bottom: 2px solid #007bff; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 10; }
    header strong { font-size: 1.2em; letter-spacing: 1px; }
    header a { background: #333; color: #fff; text-decoration: none; padding: 8px 15px; border-radius: 4px; font-size: 0.9em; transition: 0.3s; }
    header a:hover { background: #007bff; }

    /* ÁREA DE CHAT */
    .chat-container { flex: 1; display: flex; flex-direction: column; max-width: 800px; margin: 0 auto; width: 100%; position: relative; }
    
    #mensajes { 
        flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; 
        background: #0d0d0d; scroll-behavior: smooth;
    }

    /* GLOBOS DE MENSAJE */
    .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.4; position: relative; word-wrap: break-word; font-size: 0.95em; }
    
    .yo { align-self: flex-end; background: #0056b3; color: white; border-bottom-right-radius: 2px; }
    .bot { align-self: flex-start; background: #2a2a2a; color: #e0e0e0; border-bottom-left-radius: 2px; border: 1px solid #333; }

    /* ÁREA DE ESCRIBIR */
    .input-area { background: #1e1e1e; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #333; }
    
    input { flex: 1; background: #2c2c2c; border: 1px solid #444; color: white; padding: 12px; border-radius: 25px; outline: none; }
    input:focus { border-color: #007bff; }

    button { background: #007bff; color: white; border: none; padding: 0 25px; border-radius: 25px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #004494; }

  </style>
</head>
<body>

 <header>
    <strong>💬 SOPORTE EN LÍNEA</strong>
    <a href="index.html">❌ Salir</a>
 </header>

 <div class="chat-container">
    <div id="mensajes">
        <div class="msg bot">👋 ¡Hola! Soy el asistente virtual. Pregúntame sobre "stock", "precios" o "envíos".</div>
    </div>
    
    <div class="input-area">
        <input type="text" id="txtMensaje" placeholder="Escribe tu mensaje..." onkeypress="if(event.key==='Enter') enviar()">
        <button onclick="enviar()">➤</button>
    </div>
 </div>

 <script>
    const cliente = new Paho.MQTT.Client("broker.hivemq.com", 8000, "cliente_pc_" + Math.random());
    try { cliente.connect({ onSuccess: () => console.log("Conectado") }); } catch(e){}

    function enviar() {
        const txt = document.getElementById("txtMensaje");
        const msg = txt.value.trim();
        if (!msg) return;

        agregarGlobo(msg, "yo");
        txt.value = "";
        
        // Simulación de envío MQTT
        try {
            const message = new Paho.MQTT.Message(msg);
            message.destinationName = "tienda_pc/soporte";
            cliente.send(message);
        } catch(e){}

        // Respuesta auto
        setTimeout(() => {
            let resp = "Un agente humano te atenderá en breve.";
            const m = msg.toLowerCase();
            if (m.includes("precio")) resp = "Los precios están actualizados en el catálogo.";
            if (m.includes("stock")) resp = "Sí, tenemos stock disponible.";
            if (m.includes("envio")) resp = "Envíos gratis a partir de $5,000 MXN.";
            agregarGlobo(resp, "bot");
        }, 800);
    }

    function agregarGlobo(texto, tipo) {
        const div = document.createElement("div");
        div.className = "msg " + tipo;
        div.textContent = texto;
        const container = document.getElementById("mensajes");
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }
 </script>
</body>
</html>
