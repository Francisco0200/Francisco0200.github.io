<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PRÁCTICA 1: GEOLOCALIZACIÓN Y REDES SOCIALES</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Paleta Dark Mode / Gamer para hacer match con el Dashboard */
        :root { 
            --bg: #1e1e2f; 
            --panel-bg: #2a2a40;
            --accent: #ff4757; 
            --text-main: #d1d8e0;
            --text-light: #ffffff;
            --box-bg: #3d3d5c;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: var(--bg); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; }
        header { background: #151522; color: var(--accent); padding: 15px; text-align: center; border-bottom: 2px solid var(--accent); box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        header h1 { margin: 0; font-size: 1.5rem; letter-spacing: 1px; }
        .layout { display: grid; grid-template-columns: 320px 1fr 380px; gap: 15px; padding: 15px; flex: 1; }
        .panel { background: var(--panel-bg); border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; flex-direction: column; }
        
        /* Select Oscuro */
        label { font-size:12px; font-weight:bold; color: var(--text-main); margin-bottom:8px; display:block; text-transform: uppercase; letter-spacing: 0.5px; }
        select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--accent); background: var(--box-bg); color: var(--text-light); font-weight: bold; margin-bottom: 20px; outline: none; cursor: pointer; transition: 0.3s; }
        select:focus { box-shadow: 0 0 8px rgba(255, 71, 87, 0.5); }
        
        /* Cajas de información */
        .caja-info { background: var(--box-bg); padding: 12px; border-radius: 8px; margin-bottom: 12px; border-left: 5px solid var(--accent); color: var(--text-light); }
        .caja-info p { margin: 5px 0 0; font-size: 14px; color: var(--text-main); font-family: monospace; }
        
        iframe { width: 100%; height: 100%; border: none; border-radius: 10px; background: #000; }
        
        .fb-viewer { height: 450px; border: 2px solid var(--box-bg); border-radius: 10px; overflow: hidden; margin-bottom: 15px; background: white; /* FB requiere fondo blanco nativo */ }
        
        /* Botones unificados */
        .btn-x, .btn-web { 
            color: white; text-align: center; padding: 12px; 
            border-radius: 8px; text-decoration: none; font-weight: bold; 
            display: flex; align-items: center; justify-content: center; gap: 10px;
            font-size: 14px; transition: 0.3s; margin-top: auto;
        }
        .btn-web { background: var(--accent); }
        .btn-web:hover { background: #ff6b81; transform: translateY(-2px); }
        
        .btn-x { background: #151522; border: 1px solid #444; }
        .btn-x:hover { background: #000; border-color: #777; transform: translateY(-2px); }
    </style>
</head>
<body>
    <header><h1>PRÁCTICA 1: GEOLOCALIZACIÓN Y REDES SOCIALES</h1></header>
    <div class="layout">
        <div class="panel">
            <label>SELECCIONAR INSTITUCIÓN:</label>
            <select id="sel" onchange="actualizar()">
                <option value="utn">UTN Nezahualcóyotl</option>
                <option value="uaem">UAEM Nezahualcóyotl</option>
                <option value="lasalle">La Salle Neza</option>
                <option value="fes">FES Aragón (UNAM)</option>
            </select>
            <div class="caja-info"><strong>COORDENADAS GPS</strong><p id="coords">--</p></div>
            <div class="caja-info"><strong>DIRECCIÓN OFICIAL</strong><p id="dir">--</p></div>
            
            <a id="linkWeb" href="#" target="_blank" class="btn-web">
                <i class="fas fa-globe"></i> Visitar Página Oficial
            </a>
        </div>

        <div class="panel" style="padding:0;">
            <iframe id="mapa" src=""></iframe>
        </div>

        <div class="panel">
            <label>COMUNIDAD SOCIAL:</label>
            <div class="fb-viewer">
                <iframe id="fb" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>
            </div>
            <a id="linkX" href="#" target="_blank" class="btn-x">
                <i class="fab fa-x-twitter"></i> Ver perfil oficial en X
            </a>
        </div>
    </div>

    <script>
        const db = {
            "utn": {
                c: "19.3899, -98.9856", d: "Lázaro Cárdenas s/n, Benito Juárez, Nezahualcóyotl.",
                m: "https://maps.google.com/maps?q=19.3899,-98.9856&hl=es&z=16&output=embed",
                fb: "https://www.facebook.com/plugins/page.php?href=https%3A%2F%2Fwww.facebook.com%2FUTNOficial&tabs=timeline&width=340&height=450&small_header=true",
                x: "https://x.com/OficialUTN",
                web: "https://utn.edomex.gob.mx/"
            },
            "uaem": {
                c: "19.3980, -98.9890", d: "Av. de los Búhos s/n, Universidad, Nezahualcóyotl.",
                m: "https://maps.google.com/maps?q=19.3980,-98.9890&hl=es&z=16&output=embed",
                fb: "https://www.facebook.com/plugins/page.php?href=https%3A%2F%2Fwww.facebook.com%2FCU.UAEMNEZA.OFICIAL&tabs=timeline&width=340&height=450&small_header=true",
                x: "https://x.com/UAEM_MX",
                web: "https://www.uaemex.mx/"
            },
            "lasalle": {
                c: "19.3810, -98.9950", d: "Av. Adolfo López Mateos s/n, Nezahualcóyotl.",
                m: "https://maps.google.com/maps?q=19.3810,-98.9950&hl=es&z=16&output=embed",
                fb: "https://www.facebook.com/plugins/page.php?href=https%3A%2F%2Fwww.facebook.com%2Flasalleneza&tabs=timeline&width=340&height=450&small_header=true",
                x: "https://x.com/LaSalle_MX",
                web: "https://ulsaneza.edu.mx/"
            },
            "fes": {
                c: "19.4746, -99.0463", d: "Av. Rancho Seco s/n, Bosques de Aragón, Neza.",
                m: "https://maps.google.com/maps?q=19.4746,-99.0463&hl=es&z=16&output=embed",
                fb: "https://www.facebook.com/plugins/page.php?href=https%3A%2F%2Fwww.facebook.com%2FFESAragonUNAM&tabs=timeline&width=340&height=450&small_header=true",
                x: "https://x.com/ici_fesaragon",
                web: "https://www.aragon.unam.mx/"
            }
        };

        function actualizar() {
            const val = document.getElementById("sel").value;
            const u = db[val];
            document.getElementById("coords").innerText = u.c;
            document.getElementById("dir").innerText = u.d;
            document.getElementById("mapa").src = u.m;
            document.getElementById("fb").src = u.fb;
            document.getElementById("linkX").href = u.x;
            document.getElementById("linkWeb").href = u.web;
        }
        window.onload = actualizar;
    </script>
</body>
</html>
